name: Deploy Dashboard SST

on:
  push:
    branches:
      - main
    paths:
      - 'dashboard-sst/**'
      - '.github/workflows/deploy-dashboard-sst.yml'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: dashboard-sst
        run: npm install

      - name: Build Dashboard SST
        working-directory: dashboard-sst
        run: npm run build

      - name: Assemble Pages site
        run: |
          mkdir -p site/dashboard-sst
          cp index.html site/index.html
          cp -R dashboard-sst/dist/. site/dashboard-sst/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
