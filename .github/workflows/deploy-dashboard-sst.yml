name: Deploy Dashboard SST

on:
  push:
    branches:
      - main
    paths:
      - 'dashboard-sst/**'
      - '.github/workflows/deploy-dashboard-sst.yml'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: dashboard-sst
        run: npm install

      - name: Build Dashboard SST
        working-directory: dashboard-sst
        run: npm run build

      - name: Validate standalone dashboard
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('dashboard-sst/index.html', 'utf8');
          if (!html.includes('id="app"')) throw new Error('Missing application root');
          if (html.includes('/src/main.jsx')) throw new Error('Development entry point must not be published');
          const start = html.indexOf('<script>');
          const end = html.indexOf('</script>', start);
          if (start < 0 || end < 0) throw new Error('No inline application script found');
          new Function(html.slice(start + 8, end));
          console.log('Standalone dashboard JavaScript validated');
          NODE

      - name: Assemble Pages site
        run: |
          mkdir -p site/dashboard-sst
          cp index.html site/index.html
          cp -R dashboard-sst/dist/. site/dashboard-sst/
          cp dashboard-sst/ishikawa-6m.svg site/dashboard-sst/ishikawa-6m.svg

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
