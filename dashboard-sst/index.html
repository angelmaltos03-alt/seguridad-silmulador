  var z={id:id(),area:v.area,description:v.description,controls:'Pendiente de definir',probability:3,severity:3,exposure:3,level:'medium'};data.risks.push(z);selected=z.id;showToast('Área agregada al mapa.');
 }else if(kind==='investigation'){
  var inc=data.incidents.find(function(x){return x.id===v.incidentId;});data.investigations.unshift({id:id(),incidentId:v.incidentId,eventTitle:inc?inc.title:'',whys:v.whys,rootCause:v.rootCause,corrective:v.corrective,preventive:v.preventive,owner:v.owner,dueDate:v.dueDate,status:'abierta'});showToast('Investigación registrada.');
 }else if(kind==='simulator'){
  var z2={id:id(),area:v.area,description:v.description,controls:'Escenario generado por simulador. Define controles y responsable.',probability:Number(v.probability),severity:Number(v.severity),exposure:Number(v.exposure)};z2.level=level(score(z2));data.risks.push(z2);selected=z2.id;view='map';showToast('Escenario agregado al mapa.');
 }
 save();render();
}
function onClick(e){
 var b=e.target.closest('button');if(!b)return;
 if(b.dataset.view){view=b.dataset.view;render();return;}
 if(b.dataset.zone){selected=b.dataset.zone;render();return;}
 var a=b.dataset.action;if(!a)return;
 if(a==='toggle-incident'){data.incidents=data.incidents.map(function(x){return x.id===b.dataset.id?Object.assign({},x,{status:x.status==='cerrado'?'abierto':'cerrado'}):x;});save();render();}
 if(a==='delete-incident'){if(confirm('¿Eliminar este registro?')){data.incidents=data.incidents.filter(function(x){return x.id!==b.dataset.id;});save();render();}}
 if(a==='toggle-investigation'){data.investigations=data.investigations.map(function(x){return x.id===b.dataset.id?Object.assign({},x,{status:x.status==='cerrada'?'abierta':'cerrada'}):x;});save();render();}
 if(a==='profile'){var n=prompt('Nombre para mostrar en este dispositivo:',user);if(n&&n.trim()){user=n.trim();localStorage.setItem('safetyos.name',user);render();}}
 if(a==='backup'){download('SafetyOS_respaldo_'+new Date().toISOString().slice(0,10)+'.json',new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));showToast('Respaldo JSON descargado.');}
 if(a==='csv'){var rows=[['Fecha','Tipo','Evento','Área','Turno','Severidad','Días perdidos','Estado']].concat(data.incidents.map(function(x){return [x.date,x.kind,x.title,x.area,x.shift,x.severity,x.lostDays,x.status];}));var csv='\uFEFF'+rows.map(function(r){return r.map(function(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"';}).join(',');}).join('\r\n');download('SafetyOS_Eventos.csv',new Blob([csv],{type:'text/csv;charset=utf-8'}));showToast('CSV descargado.');}
 if(a==='print'){window.print();}
}
function onChange(e){
 if(e.target.dataset.compliance){var key=e.target.dataset.compliance;data.compliance=data.compliance.map(function(x){return x.id===key?Object.assign({},x,{status:e.target.value}):x;});save();render();}
}
app.addEventListener('click',onClick);app.addEventListener('submit',onSubmit);app.addEventListener('change',onChange);
window.addEventListener('error',function(e){var root=document.getElementById('app');if(root&&!root.innerHTML.trim())root.textContent='No se pudo iniciar el Dashboard SST. Recarga la página.';});
render();
})();
</script>
</body>
</html>
