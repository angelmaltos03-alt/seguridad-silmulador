/* Safety EHS · Cruz de seguridad */
.safety-cross-board{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:repeat(7,minmax(44px,1fr));gap:clamp(4px,1vw,9px);width:min(100%,690px);aspect-ratio:1/1;margin:22px auto;padding:clamp(9px,2vw,18px);border:1px solid #29465b;border-radius:18px;background:radial-gradient(ellipse at center,#14354a 0,#0a1b2b 74%);box-shadow:inset 0 0 40px #06111c}
.cross-day{min-width:0;min-height:0;aspect-ratio:1/1;border:1px solid #2c5368;border-radius:clamp(5px,1vw,11px);background:#15513e;color:#d8f5e5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(1px,.4vw,5px);cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s;padding:2px}
.cross-day b{font-size:clamp(11px,2.3vw,21px);line-height:1}.cross-day small{font-size:clamp(6px,.85vw,9px);letter-spacing:.04em;font-weight:900}
.cross-day:hover,.cross-day.selected{outline:2px solid #f3d17b;outline-offset:1px;transform:scale(1.045);z-index:2;box-shadow:0 0 0 4px #f3d17b22}
.cross-day.cross-accident{background:#71343a;border-color:#d66c6c;color:#ffe3df}.cross-day.cross-accident-disabled{background:#a32132;border-color:#ff8c88;color:#fff}.cross-day.cross-incident{background:#70551e;border-color:#d8aa4b;color:#ffedc4}.cross-day.cross-future,.cross-day.cross-outside{background:#142638;border-color:#263b4d;color:#60798b}.cross-day.cross-safe{background:#15513e;border-color:#3d9c75;color:#d4ffe9}
.cross-center-day{box-shadow:inset 0 0 0 1px #ffffff18}
.cross-month-head{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.cross-month-head h3{margin:5px 0;text-transform:capitalize;font-size:20px}.cross-month-head p{margin:0;color:#8fa8ba;font-size:10px}.cross-month-controls{display:flex;align-items:center;gap:8px}.cross-month-stats{display:flex;flex-wrap:wrap;gap:8px 22px;padding:12px 0;border-bottom:1px solid #213b4e;color:#91aabb;font-size:10px}.cross-month-stats b{color:#e2f0f5;font-size:15px;margin-right:4px}
.quick-day-status{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:0 0 16px;padding:12px;border:1px solid #29465b;border-radius:10px;background:#0a1d2c}.quick-day-status>span{width:100%;font-size:8px;font-weight:900;letter-spacing:.12em;color:#8ba8ba}.quick-status{border:1px solid #335064;border-radius:7px;padding:9px 12px;font-size:10px;font-weight:800;color:#e2edf2;background:#142b3c}.quick-status.safe{background:#154734;border-color:#32865e}.quick-status.incident,.quick-status.near{background:#5d491d;border-color:#a78032}.quick-status.accident{background:#762f38;border-color:#c65c62}.quick-status:hover{filter:brightness(1.2)}
.safety-day-editor{border-color:#39758a}.safety-day-editor textarea{min-height:76px}.safety-day-editor .field.full{grid-column:1/-1}
@media(max-width:700px){.safety-cross-board{grid-template-rows:repeat(7,minmax(34px,1fr));gap:4px;padding:8px;border-radius:12px}.cross-day{border-radius:5px}.cross-day small{font-size:6px}.cross-month-head h3{font-size:17px}.cross-month-controls{width:100%;justify-content:space-between}.quick-status{flex:1 1 calc(50% - 8px);padding:10px 6px}}

/* SAFETY EHS · Investigación de accidentes / Ishikawa 6M */
.fishbone-visual{overflow-x:auto;padding:clamp(10px,2vw,18px);border:1px solid #294b60;border-radius:15px;background:radial-gradient(ellipse at 50% 48%,#14384b 0,#0b1d2b 72%);scrollbar-color:#42677b #0b1d2b}
.ishikawa-svg{width:100%;height:auto;min-width:760px;display:block}
.fishbone-caption{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;flex-wrap:wrap;margin:0 0 12px;padding:0 2px}
.fishbone-caption span{display:grid;gap:3px;color:#dceaf2;font-size:12px}.fishbone-caption b{font-size:11px;letter-spacing:.12em;color:#79dfe1}
.fishbone-caption small{max-width:440px;color:#8fa9ba;font-size:9px;line-height:1.5}
.fishbone-wrap{display:grid;gap:12px}
.fishbone-root{display:grid;grid-template-columns:minmax(140px,210px) 1fr;gap:12px;align-items:center;padding:13px 15px;border:1px solid #75505a;border-radius:10px;background:linear-gradient(90deg,#38252e,#182a39)}
.fishbone-root b{font-size:9px;letter-spacing:.12em;color:#ffc0b9}.fishbone-root span{font-size:12px;color:#f0e6e7;line-height:1.5}
.analysis-section{margin-top:22px;padding-top:18px;border-top:1px solid #263f52}
.analysis-section>h2{margin:6px 0 10px}
.why-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.why-step{padding:12px;border:1px solid #29465b;border-radius:10px;background:#0b1e2d}
.why-step:first-child{grid-column:1/-1;border-color:#39758a}
.why-step textarea{min-height:65px}
.fishbone-input{padding:13px;border:1px solid #29465b;border-radius:10px;background:#0b1e2d;min-width:0}
.fishbone-input>span{display:block;color:#8de5e7;font-weight:800;font-size:11px;letter-spacing:.03em}
.fishbone-input>small{display:block;min-height:28px;margin:5px 0 9px;color:#8fa9ba;font-size:9px;line-height:1.45}
.fishbone-input textarea{min-height:80px}
.why-results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0}
.why-result{display:grid;gap:5px;padding:11px;border:1px solid #29465b;border-radius:8px;background:#0b1e2d}
.why-result b{font-size:9px;color:#79dfe1;letter-spacing:.06em}.why-result span{font-size:11px;line-height:1.5;color:#d3e2ea;overflow-wrap:anywhere}
@media(max-width:700px){.ishikawa-svg{min-width:760px}.why-form,.why-results{grid-template-columns:1fr}.why-step:first-child{grid-column:auto}.fishbone-root{grid-template-columns:1fr;gap:6px}}

 if(a==='csv'){var rows=[['Fecha','Tipo','Evento','Área','Parte del cuerpo','Vista','Lado','Turno','Severidad','Incapacitante','Días perdidos','Estado']].concat(data.incidents.map(function(x){return [x.date,x.kind,x.title,x.area,x.bodyPart,x.bodySide,x.bodyLateral,x.shift,x.severity,x.incapacitating?'Sí':'No',x.lostDays,x.status];}));var csv='\uFEFF'+rows.map(function(r){return r.map(function(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"';}).join(',');}).join('\r\n');download('SafetyOS_Eventos.csv',new Blob([csv],{type:'text/csv;charset=utf-8'}));showToast('CSV descargado.');}

 if(a==='edit-walk'){editingWalkId=b.dataset.id;render();return;}if(a==='cancel-edit-walk'){editingWalkId='';render();return;}if(a==='delete-walk'){if(confirm('¿Eliminar este registro de recorrido/hallazgo?')){data.commissionWalks=data.commissionWalks.filter(function(x){return x.id!==b.dataset.id;});save();render();}return;}if(a==='walk-print'){window.print();return;}if(a==='walk-csv'){var wl=data.commissionWalks.filter(function(x){return Number(x.year||String(x.date||'').slice(0,4))===Number(annualYear);}),wr=[['Folio','Fecha','Hora inicio','Hora término','Trabajadores del centro','Tipo de recorrido','Departamento','Área','Ubicación','Clasificación','Familia de peligro','Fuente de peligro','Personas expuestas','Probabilidad 1-5','Severidad 1-5','Evaluación del riesgo','Prioridad','Descripción','Consecuencia','Causas','Norma aplicable','Numeral','Fundamento de aplicabilidad','Medidas correctivas','Recomendaciones y prioridad','Seguimiento previo','Responsable','Fecha compromiso','Estado','Participantes','Lugar/fecha cierre acta','Firmas/constancia','Evidencia','Verificación cierre']].concat(wl.map(function(x){return [x.folio,x.date,x.startTime,x.endTime,x.workerCount,x.type,x.department,x.area,x.location,x.findingType||x.category,x.hazardType,x.hazardSource,x.exposed,x.probability,x.severity,x.riskAssessment,x.priority,x.description,x.consequence,x.causes,x.standard,x.clause,x.normativeBasis,x.action,x.recommendations,x.previousFollowup,x.owner,x.dueDate,x.status,x.participants,x.closingPlaceDate,x.signatories,x.evidence,x.closure];}));var wc='\\uFEFF'+wr.map(function(r){return r.map(function(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"';}).join(',');}).join('\\r\\n');download('Comision_Seguridad_Hallazgos_'+annualYear+'.csv',new Blob([wc],{type:'text/csv;charset=utf-8'}));showToast('Bitácora de comisión exportada.');return;}if(a==='annual-excel'){exportAnnualExcel();return;}

function onChange(e){
 if(e.target.dataset.safetyMonth){if(/^\d{4}-\d{2}$/.test(e.target.value)){safetyMonth=e.target.value;selectedSafetyDate=safetyMonth+'-01';render();}return;}if(e.target.dataset.annualMonthButton!==undefined){annualMonth=Math.max(0,Math.min(11,Number(e.target.dataset.annualMonthButton)||0));render();return;}
 if(e.target.dataset.compliance){var key=e.target.dataset.compliance;data.compliance=data.compliance.map(function(x){return x.id===key?Object.assign({},x,{status:e.target.value}):x;});save();render();return;}if(e.target.dataset.annualMonth!==undefined){annualMonth=Math.max(0,Math.min(11,Number(e.target.value)||0));render();return;}if(e.target.dataset.weekState){var task=data.annualPlan.find(function(x){return x.id===e.target.dataset.weekState;});if(task){task.weeklyStatus=task.weeklyStatus||{};var mo=Number(e.target.dataset.month),wk=Number(e.target.dataset.week);task.weeklyStatus[mo]=task.weeklyStatus[mo]||{};task.weeklyStatus[mo][wk]=e.target.value;var vals=Object.keys(task.weeklyStatus).reduce(function(a,k){return a.concat(Object.values(task.weeklyStatus[k]));},[]);var plannedCount=vals.filter(function(v){return v==='programada'||v==='completada';}).length,completedCount=vals.filter(function(v){return v==='completada';}).length;task.status=plannedCount>0&&completedCount===plannedCount?'completado':plannedCount>0?'proceso':'pendiente';save();render();}return;}if(e.target.dataset.annualYear){annualYear=Math.max(2020,Math.min(2100,Number(e.target.value)||new Date().getFullYear()));render();return;}if(e.target.dataset.annualStatus){data.annualPlan=data.annualPlan.map(function(x){return x.id===e.target.dataset.annualStatus?Object.assign({},x,{status:e.target.value}):x;});save();render();return;}if(e.target.dataset.pipcStatus){data.pipc.items=data.pipc.items.map(function(x){return x.id===e.target.dataset.pipcStatus?Object.assign({},x,{status:e.target.value}):x;});save();render();return;}if(e.target.dataset.pipcOwner){data.pipc.items=data.pipc.items.map(function(x){return x.id===e.target.dataset.pipcOwner?Object.assign({},x,{owner:e.target.value}):x;});save();return;}if(e.target.dataset.elssaStatus){data.elssa.items=data.elssa.items.map(function(x){return x.id===e.target.dataset.elssaStatus?Object.assign({},x,{status:e.target.value}):x;});save();render();return;}if(e.target.dataset.investigationSelect){selectedInvestigation=e.target.value;render();return;}
 if(e.target.dataset.companyLogo&&e.target.files&&e.target.files[0]){
  var lf=e.target.files[0];if(!/^image\/(png|jpeg|webp)$/.test(lf.type)){showToast('Usa un logo PNG, JPG o WEBP.');return;}
  var lr=new FileReader();lr.onload=function(ev){var im=new Image();im.onload=function(){var sc=Math.min(1,700/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*sc);cv.height=Math.round(im.height*sc);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);data.companyLogo=cv.toDataURL('image/png');save();var preview=document.getElementById('setup-logo-preview');if(preview){if(preview.tagName==='IMG')preview.src=data.companyLogo;else{var pic=document.createElement('img');pic.id='setup-logo-preview';pic.className='setup-logo-preview';pic.src=data.companyLogo;pic.alt='Logotipo de la empresa';preview.replaceWith(pic);}}showToast('Logotipo de empresa guardado.');if(data.setupComplete&&!editingProfile)render();};im.src=ev.target.result;};lr.readAsDataURL(lf);return;
 }
 if(e.target.dataset.layoutUpload&&e.target.files&&e.target.files[0]){
  var file=e.target.files[0];if(!/^image\/(png|jpeg|webp)$/.test(file.type)){showToast('Formato no compatible. Usa PNG, JPG o WEBP.');return;}
  var reader=new FileReader();reader.onload=function(ev){var img=new Image();img.onload=function(){var scale=Math.min(1,1500/Math.max(img.width,img.height)),w=Math.round(img.width*scale),h=Math.round(img.height*scale),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);var url=c.toDataURL('image/jpeg',.68);if(url.length>2200000)url=c.toDataURL('image/jpeg',.48);data.layout={name:file.name.replace(/\.[^.]+$/,''),imageData:url,updatedAt:new Date().toISOString()};save();render();showToast('Layout cargado. Ahora puedes ubicar tus áreas.');};img.onerror=function(){showToast('No se pudo leer la imagen.');};img.src=ev.target.result;};reader.readAsDataURL(file);
 }
