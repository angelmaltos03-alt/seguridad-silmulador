function mergeCatalog(base,saved){

 return merged;
}

la genérica como aprobación oficial.</div></article>'+

 if(a==='annual-csv'){var list=data.annualPlan.filter(function(x){return Number(x.year)===Number(annualYear);});var rows=[['Año','Categoría','Actividad','Responsable','Prioridad','Frecuencia','Inicio','Término','Estado','Evidencia','Observaciones']].concat(list.map(function(x){return [x.year,x.category,x.title,x.owner,x.priority,x.frequency,x.startDate,x.dueDate,x.status,x.evidence,x.notes];}));var csv='\\uFEFF'+rows.map(function(r){return r.map(function(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"';}).join(',');}).join('\\r\\n');download('Plan_Anual_SST_'+annualYear+'.csv',new Blob([csv],{type:'text/csv;charset=utf-8'}));showToast('Plan anual exportado.');}
 if(a==='delete-zone'){var zone=data.risks.find(function(x){return x.id===b.dataset.id;});if(zone&&data.incidents.some(function(x){return x.area===zone.area;})){showToast('Esta área tiene eventos asociados. Cambia o conserva el área para mantener la trazabilidad.');}else if(confirm('¿Eliminar el área '+(zone?zone.area:'')+'?')){data.risks=data.risks.filter(function(x){return x.id!==b.dataset.id;});selected=data.risks[0]?data.risks[0].id:'';save();render();}}
}
function onChange(e){
 if(e.target.dataset.safetyMonth){if(/^\\d{4}-\\d{2}$/.test(e.target.value)){safetyMonth=e.target.value;render();}return;}
 if(e.target.dataset.compliance){var key=e.target.dataset.compliance;data.compliance=data.compliance.map(function(x){return x.id===key?Object.assign({},x,{status:e.target.value}):x;});save();render();return;}if(e.target.dataset.annualMonth!==undefined){annualMonth=Math.max(0,Math.min(11,Number(e.target.value)||0));render();return;}if(e.target.dataset.weekState){var task=data.annualPlan.find(function(x){return x.id===e.target.dataset.weekState;});if(task){task.weeklyStatus=task.weeklyStatus||{};var mo=Number(e.target.dataset.month),wk=Number(e.target.dataset.week);task.weeklyStatus[mo]=task.weeklyStatus[mo]||{};task.weeklyStatus[mo][wk]=e.target.value;var vals=Object.keys(task.weeklyStatus).reduce(function(a,k){return a.concat(Object.values(task.weeklyStatus[k]));},[]);task.status=vals.some(function(v){return v==='programada';})?'proceso':vals.some(function(v){return v==='completada';})?'completado':'pendiente';save();render();}return;}if(e.target.dataset.annualYear){annualYear=Math.max(2020,Math.min(2100,Number(e.target.value)||new Date().getFullYear()));render();return;}if(e.target.dataset.annualStatus){data.annualPlan=data.annualPlan.map(function(x){return x.id===e.target.dataset.annualStatus?Object.assign({},x,{status:e.target.value}):x;});save();render();return;}if(e.target.dataset.pipcStatus){data.pipc.items=data.pipc.items.map(function(x){return x.id===e.target.dataset.pipcStatus?Object.assign({},x,{status:e.target.value}):x;});save();render();return;}if(e.target.dataset.pipcOwner){data.pipc.items=data.pipc.items.map(function(x){return x.id===e.target.dataset.pipcOwner?Object.assign({},x,{owner:e.target.value}):x;});save();return;}if(e.target.dataset.elssaStatus){data.elssa.items=data.elssa.items.map(function(x){return x.id===e.target.dataset.elssaStatus?Object.assign({},x,{status:e.target.value}):x;});save();render();return;}if(e.target.dataset.investigationSelect){selectedInvestigation=e.target.value;render();return;}
 if(e.target.dataset.companyLogo&&e.target.files&&e.target.files[0]){
  var lf=e.target.files[0];if(!/^image\/(png|jpeg|webp)$/.test(lf.type)){showToast('Usa un logo PNG, JPG o WEBP.');return;}
  var lr=new FileReader();lr.onload=function(ev){var im=new Image();im.onload=function(){var sc=Math.min(1,700/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*sc);cv.height=Math.round(im.height*sc);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);data.companyLogo=cv.toDataURL('image/png');save();showToast('Logotipo de empresa guardado.');if(data.setupComplete)render();};im.src=ev.target.result;};lr.readAsDataURL(lf);return;
 }
 if(e.target.dataset.layoutUpload&&e.target.files&&e.target.files[0]){
  var file=e.target.files[0];if(!/^image\/(png|jpeg|webp)$/.test(file.type)){showToast('Formato no compatible. Usa PNG, JPG o WEBP.');return;}
  var reader=new FileReader();reader.onload=function(ev){var img=new Image();img.onload=function(){var scale=Math.min(1,1500/Math.max(img.width,img.height)),w=Math.round(img.width*scale),h=Math.round(img.height*scale),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);var url=c.toDataURL('image/jpeg',.68);if(url.length>2200000)url=c.toDataURL('image/jpeg',.48);data.layout={name:file.name.replace(/\.[^.]+$/,''),imageData:url,updatedAt:new Date().toISOString()};save();render();showToast('Layout cargado. Ahora puedes ubicar tus áreas.');};img.onerror=function(){showToast('No se pudo leer la imagen.');};img.src=ev.target.result;};reader.readAsDataURL(file);
 }
}
app.addEventListener('click',onClick);app.addEventListener('submit',onSubmit);app.addEventListener('change',onChange);
window.addEventListener('error',function(e){var root=document.getElementById('app');if(root&&!root.innerHTML.trim())root.textContent='No se pudo iniciar el Dashboard SST. Recarga la página.';});
render();
